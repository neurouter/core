name: Release

on:
  push:
    tags: ['v*.*.*']
  # Re-run one job for an existing tag (e.g. after a workflow fix) without moving the tag.
  workflow_dispatch:
    inputs:
      tag: { description: 'Existing tag, e.g. v0.1.0', required: true }
      job: { description: 'Job to run', type: choice, options: [all, image, chart, npm], default: all }

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'image'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/neurouter/core:${{ steps.meta.outputs.version }}
            ghcr.io/neurouter/core:latest
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/neurouter/core@${{ steps.build.outputs.digest }}

  chart:
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'chart'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - uses: azure/setup-helm@v5
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/neurouter-core --version "${TAG#v}" --app-version "${TAG#v}"
          # chart name neurouter-core: oci://ghcr.io/neurouter/charts/neurouter holds the deprecated Neurouter Hub chart
          helm push neurouter-core-*.tgz oci://ghcr.io/neurouter/charts

  npm:
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm publish --provenance
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '26', registry-url: 'https://registry.npmjs.org' }
      # npm trusted publishing (GitHub OIDC, no token) needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci && npm run build
      - run: |
          set -euo pipefail
          v="${TAG#v}"
          # dependency order: each package's @neurouter/* deps are published before it
          for ws in @neurouter/shared @neurouter/compiler @neurouter/evals @neurouter/executor @neurouter/server neurouter; do
            pv="$(npm pkg get version -w "$ws" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(Object.values(JSON.parse(s))[0]))')"
            if [ "$pv" != "$v" ]; then echo "$ws is $pv, tag is $v" >&2; exit 1; fi
            if npm view "$ws@$v" version >/dev/null 2>&1; then echo "$ws@$v already published"; continue; fi
            # prepack (scripts/prepack.mjs) copies LICENSE/NOTICE, the CLI README and the console build (web-dist) into the tarball
            npm publish -w "$ws" --access public --provenance --ignore-scripts=false
          done
