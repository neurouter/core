name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/neurouter/core:${{ steps.meta.outputs.version }}
            ghcr.io/neurouter/core:latest
      - uses: sigstore/cosign-installer@v4
      - run: cosign sign --yes ghcr.io/neurouter/core@${{ steps.build.outputs.digest }}

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/neurouter-core --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"
          # chart name neurouter-core: oci://ghcr.io/neurouter/charts/neurouter holds the deprecated Neurouter Hub chart
          helm push neurouter-core-*.tgz oci://ghcr.io/neurouter/charts

  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm publish --provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '26', registry-url: 'https://registry.npmjs.org' }
      - run: npm ci && npm run build
      - run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          # dependency order: each package's @neurouter/* deps are published before it
          for ws in @neurouter/shared @neurouter/compiler @neurouter/evals @neurouter/executor @neurouter/server neurouter; do
            pv="$(npm pkg get version -w "$ws" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(Object.values(JSON.parse(s))[0]))')"
            if [ "$pv" != "$v" ]; then echo "$ws is $pv, tag is $v" >&2; exit 1; fi
            if npm view "$ws@$v" version >/dev/null 2>&1; then echo "$ws@$v already published"; continue; fi
            # prepack (scripts/prepack.mjs) copies LICENSE/NOTICE, the CLI README and the console build (web-dist) into the tarball
            npm publish -w "$ws" --access public --provenance --ignore-scripts=false
          done
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
