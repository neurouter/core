apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neurouter.fullname" . }}
  labels: {{- include "neurouter.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  PORT: {{ .Values.service.port | quote }}
  PUBLIC_URL: {{ .Values.publicUrl | quote }}
  ORG_NAME: {{ .Values.orgName | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  TRUST_PROXY: "true"
  SERVE_WEB: "true"
  DB_POOL_MAX: {{ .Values.database.poolMax | quote }}
  MIGRATE_ON_START: {{ or (eq .Values.migrations.mode "onStart") .Release.IsInstall | quote }}
  COORDINATION_BACKEND: postgres
  EMBEDDINGS_ENABLED: {{ .Values.embeddings.enabled | quote }}
  EMBEDDINGS_MODEL: {{ .Values.embeddings.model | quote }}
  EMBEDDINGS_DTYPE: {{ .Values.embeddings.dtype | quote }}
  EMBEDDINGS_ALLOW_REMOTE: "false"
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_SCOPES: {{ .Values.oidc.scopes | quote }}
  OIDC_GROUPS_CLAIM: {{ .Values.oidc.groupsClaim | quote }}
  OIDC_ADMIN_GROUPS: {{ .Values.oidc.adminGroups | quote }}
  OIDC_DEFAULT_ROLE: {{ .Values.oidc.defaultRole | default "viewer" | quote }}
  OIDC_ALLOWED_EMAIL_DOMAINS: {{ .Values.oidc.allowedEmailDomains | quote }}
  {{- with .Values.oidc.bootstrapAdminEmail }}
  BOOTSTRAP_ADMIN_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.archive.url }}
  AUDIT_ARCHIVE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.metrics.token }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  OTEL_SDK_DISABLED: {{ not .Values.otel.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: neurouter
  NEUROUTER_CONFIG_MODE: {{ .Values.config.mode | quote }}
  {{- if .Values.config.neurouterYaml }}
  NEUROUTER_CONFIG: /config/neurouter.yaml
  {{- end }}
  {{- if eq .Values.executor.mode "sidecar" }}
  NEUROUTER_EXECUTOR_MODE: remote
  NEUROUTER_EXECUTOR_URL: {{ printf "tcp://127.0.0.1:%v" .Values.executor.port | quote }}
  {{- else if eq .Values.executor.mode "deployment" }}
  NEUROUTER_EXECUTOR_MODE: remote
  NEUROUTER_EXECUTOR_URL: {{ printf "tcp://%s-executor:%v" (include "neurouter.fullname" .) .Values.executor.port | quote }}
  {{- else }}
  NEUROUTER_EXECUTOR_MODE: "off"
  {{- end }}
  NEUROUTER_EXECUTOR_POOL_MAX: {{ .Values.executor.poolMax | quote }}
{{- if .Values.config.neurouterYaml }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neurouter.fullname" . }}-config
  labels: {{- include "neurouter.labels" . | nindent 4 }}
data:
  neurouter.yaml: |
{{ .Values.config.neurouterYaml | indent 4 }}
{{- end }}
