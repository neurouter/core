{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "neurouter-core.fullname" . }}
  labels: {{- include "neurouter-core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "neurouter-core.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: {{ .Values.service.port }}, protocol: TCP }]
  egress:
    # DNS
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- range .Values.networkPolicy.allowEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
            except: {{- toYaml $.Values.networkPolicy.denyEgressCidrs | nindent 14 }}
    {{- end }}
{{- end }}
